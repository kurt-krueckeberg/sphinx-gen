        Frau, u[nd]: des [Rödemiesters?] Frau in Nordholtz
      trans: >-
        Wolter Weilandt of Petzen’s daughter, Anna Margaretha, was
        baptized on 20 January. The godmothers were Mrs. Mier of Röcke,
        Daniel Vogt’s wife, and the wife of Rödemeister in Nordholtz.
     
    - name: Cort Hinrig Weilandt 
      image_no: 58
      edate: 13 February 1679
      residence: Petzen
      ifile: petzen-band1a-img58-weiland.png
      vdate: 30 August 2026
      url: https://www.archion.de/p/f3c5c0d057/
      literal: >-
        Wolter Weilandt zu Petzen Sohn, Cort Hinrig getaufft
        den 13 Februarij, gefattern der Krüger zu Petzen,
        [?] Aldags ältester Sohn, und der [Kohlmeister?] auf der [Hökersau?]
      trans: >-
        Wolter Weilandt of Petzen’s son, Cort Hinrig, was baptized on 13 February. The sponsors were the innkeeper of Petzen,
        [?] Aldag’s eldest son, and the charcoal master at/on the [Hökersau?].

    - name: Ilse Margaretha Weÿlandt
      image_no: 141
      edate: 8 May 1729
      residence: Nammen
      ifile: petzen-band1a-img141-weiland.png 
      vdate: 3 Spetember 2026
      url: https://www.archion.de/p/dac7b22d65/ 
      literal: >-
        14) den 6t Maÿ ist Johann Weÿlandts auß Nammen Töchterlein Ilse Margaretha getauft. Gev. die Schillingsche und die Brandtsche.
      trans: >-
        On May 6, Johann Weÿland of Nammen had his little daughter Ilse Margaretha baptized. Sponsors: Mrs. Schilling and Mrs. Brandt.
      text: >-
        There is a burial record from 4 November 1735 of female child named Elisabeth Margaretha Weilands born
        6 years and 39 weeks earlier.

        **What this suggests:**

        The Margareta Elisabeth Weiland buried on 4 November 1737 was 6 years and 39 weeks old 
        when she died. "Ilse" is short for Elisabeth. This would place her birth on 4 Feb. 1731, which is within one 
        month of this baptism record. However, the father's given name in this baptism record is *Johann* whereas the father's given names in the
        4 Nov. 1735 burial record are *Hans Harman*.

        The burial record explicitly identifies the father as militis (a soldier), and the family therefore *might* have not have been living in
        the Petzen parish at the time of the child's birth and baptism since soldiers' households moved with postings.

