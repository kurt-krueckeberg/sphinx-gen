      url: https://www.archion.de/p/6e4a60e49b/ 
      literal: "Hans Hinrich Weilandt von Petzen und Anna Margaretha Sanders auf den Berenbusch den 2 Martij copuliret"
      trans: "Hans Hinrich Weilandt of Petzen and Anna Margaretha Sanders at Berenbusch were married on March 2." 
    
    - name: Johan Tonnis Weyland
