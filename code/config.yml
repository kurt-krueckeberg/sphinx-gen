    image-no: 26
    ifile: petzen-band1b-img26-weiland.png
    edate: 2 March 1702
    vdate: 27 August 2026
    url: https://www.archion.de/p/6e4a60e49b/ 
    literal: "Hans Hinrich Weilandt von Petzen und Anna Margaretha Sanders auf den Berenbusch den 2 Martij copuliret"
    trans: "Hans Hinrich Weilandt of Petzen and Anna Margaretha Sanders at Berenbusch were married on March 2." 
  
  - name: Johan Tonnis Weyland 
    image-no: 29
    ifile: petzen-band1b-img29-weiland.png 
    edate: 28 October 1708 
    vdate: 27 August 2026
    url: https://www.archion.de/p/63241c08c4/ 
    literal: "den 28. 8br [sint] copuliret Johan Tonnis Weyland aus Peezen mitt Annen Jlsabey Brandts aus Nammen, mitt Welcher er schon vorhin ein Fuhr Kind gezeugt"
    trans: "On October 28, Johan Tonnis Weyland of Peezen was married to Anna Ilsabey Brandt of Nammen, with whom he had already previously fathered an illegitimate child."
  
