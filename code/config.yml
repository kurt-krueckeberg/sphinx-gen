    - name:
      image: resume with image 47 
      ifile: 
      date:
      vdate:
      url:
      trans: >-
        d 23 febr. Johann Herman Weiland Krüger zu Nammen wurde mit Catharina
        Maria Röbken Witwe Schnaken zu Nammen von dem H. Insp: Cramer zu Lerbeck unbefugter weise co
        puliret, weil man alhier Königl. Verordnung zufolge der Frau intra annum luctus keinen Mann geben
        wollen. Worauf wir sofort bey dem H. Insp. Cramer gegen diesen Eingriff in hiesige Parochie protestiret,
        und ausgemacht, daß in dortiges Kirchen Buch dabey notiret werden solle, ,,es können daraus keine Folgerungen
        gemacht werden, als gehöre der Krug zu Nammen nach Lerbek,,

