baptisms:
  record-symbol: B
  file-format: PET-B-%year%
  volume-name: Verzeichnis der Getauften und Konfirmierten 1641-1784
  total-images:
  records:
  - name: Daughter of Hans Weiland
    image-no: 10
    year: 1648
    edate: 13 August 1648 
    locality:
    ifile: petzen-band1a-img10-weiland.png 
    vdate: 28 August 2026
    url: https://www.archion.de/p/e3a8b2db39/ 
    literal: >-
      Hans Weilands tochter Anna Sophia eodem die getaufft
      gefattere: Metta Sophia Crufelers, Anna N., ancilla in praedio
      Bückeburgensi. Anna Maria, Jacobi pastörsche in Meinsen, N. Köpper
      von Achumb.
    trans: >-
      Hans Weiland's daughter Anna Sophia, baptized on the same day [as the previous entry, i.e., 13 August 1648].
      Godparents: Metta Sophia Crufelers; Anna N., a maidservant on the Bückeburg estate; Anna Maria, wife of Pastor Jacobi in Meinsen; N. Köpper from Achum.

  - name: Hans Weiland's Daughter
    image-no: 12 
    year: 1651
    edate: 11 April 1651
    locality:
    ifile: petzen-band1a-img12-weiland.png
    vdate: 30 August 2026 
    url: https://www.archion.de/p/621a0af765/ 
    literal: "Hans Weilands tochter Ilschen, gf. Ilsche Sandersche im Berenbusche, den 11 Aprilis." 
    trans: "Hans Weiland's daughter Ilschen. Godparent: Ilsche, wife of Sanders, in Berenbusch. On 11 April."
 
  - name: Anna Catharine Eleonora Weiland 
    image-no: 55 
    year: 1676
    edate: 27 August 1676
    locality: Petzen
    ifile: petzen-band1a-img55-weiland.png  
    vdate: 30 August 2026 
    url: https://www.archion.de/p/6d83b6a5c9/
    literal: >- 
      Wolter Weilands zu Petzen Tochter Anna Catharina Eleonora
      getaufft den 27  Aügusti gefattern Johan Halvekopfs Schwester
