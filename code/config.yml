  baptisms:
    volume: band1a
    event: Baptism
    record-symbol: B
    records:
    - name: Daughter of Hans Weiland
      image-no: 10
      edate: 13 August 1648 
      residence:
      ifile: petzen-band1a-img10-weiland.png 
      vdate: 28 August 2026
      url: https://www.archion.de/p/e3a8b2db39/ 
      literal: >-
        Hans Weilands tochter Anna Sophia eodem die getaufft
        gefattere: Metta Sophia Crufelers, Anna N., ancilla in praedio
        Bückeburgensi. Anna Maria, Jacobi pastörsche in Meinsen, N. Köpper
        von Achumb.
      trans: >-
        Hans Weiland's daughter Anna Sophia, baptized on the same day [as the previous entry, i.e., 13 August 1648].
        Godparents: Metta Sophia Crufelers; Anna N., a maidservant on the Bückeburg estate; Anna Maria, wife of Pastor Jacobi in Meinsen; N. Köpper from Achum.
  
